<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Tables and images with bootstrap</title>
</head>
<body>
    
    <h2 class="text-center">Naruto Charachters - Team 7</h2>
    <div class="row">
    <img class="rounded mx-auto d-block col-lg-4" src="https://i.redd.it/efgzdey00y9f1.jpg" alt="Uchiha Sasuke" height="300px" width="450"> 
    <img class="rounded-circle mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1riORXJjCdZjeTmoq8L4hJoJT3qh_mKqJ6aDuvuG4lXWjLtr7BHwYC-iR&s=10" alt="Uchiha Sakura" height="300px" width="450">
    <img class="img-thumbnail mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGEdoojcXrG5uBEp9Ic4ZYxHESFhUuW-_gm9iiF9HyWgUP_Zaulow0XMg&s=10" alt="Uzumaki Naruto" height="300px" width="420">
    </div>
    <h1 class="text-center">Bootstrap Table</h1>
    <img class="mx-auto d-flex" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVLTlnNmeJAdtk_4trwyXcIVdHddvpy-jyI0Q3FyDcSJU_d3t6CMHb4m5y&s=10" height="350" width="500" alt="spiderman">
    <table class="table table-hover table-bordered table-dark container">
        <tr>
            <th class="bg-primary" scope="col">Name</th>
            <th class="bg-primary" scope="col">Favorite anime</th>
            <th class="bg-primary" scope="col">Protagonist</th>
        </tr>
        <tr>
            <td>Theos Tomas</td>
            <th>Bleach</th>
            <td><img src="https://upload.wikimedia.org/wikipedia/en/1/1e/IchigoKurosakiBleach.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"height="150" width="200"></td>
        </tr>
        <tr>
            <td>Jamsed Junaid</td>
            <th>Black Clover</th>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbAa84RrFdGvlY3zGOMHMKnuAYWSmO4rX42W2cIZB2ZQ&s"height="150" width="200"></td>
        </tr>
        <tr>
            <td>Derek Ayuyao</td>

        </tr>
        <tr>
            <td>Dyce Aquino</td>
